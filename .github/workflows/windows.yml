name: Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.7
          uv sync --locked --no-dev
      - name: Python syntax and functional tests
        run: |
          uv run --no-dev python -m compileall -q qq_activity tests
          uv run --no-dev python -m unittest discover -s tests -v
      - name: Receiver syntax and contract tests
        run: |
          node --check receiver/preload.cjs
          node --test receiver/contract.test.cjs
