name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          architecture: x64
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.7
          uv sync --locked --no-dev
      - name: Python syntax and functional tests
        run: |
          uv run --no-dev python -m compileall -q qq_activity tests
          uv run --no-dev python -m unittest discover -s tests -v
      - name: Receiver syntax and contract tests
        run: |
          node --check receiver/preload.cjs
          node --test receiver/contract.test.cjs
