name: Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          architecture: x64
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.7
          uv sync --locked --no-dev
      - name: Python syntax and functional tests
        run: |
          uv run --no-dev python -m compileall -q qq_activity tests
          uv run --no-dev python -m unittest discover -s tests -v
      - name: Receiver syntax and contract tests
        run: |
          node --check receiver/preload.cjs
          node --test receiver/contract.test.cjs
