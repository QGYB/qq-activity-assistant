name: 问题报告
description: 提供复现步骤及已脱敏的错误
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: '请勿上传群聊天、个人档案、真实表单链接、Cookie、令牌或完整本机配置。安全漏洞请使用 Security 的私密报告入口。'
  - type: textarea
    id: behavior
    attributes:
      label: 问题和期望行为
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: 工具、Windows 和 QQ 版本
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已去除个人信息的错误片段
